name: Dependencies

on:
  schedule:
    # Check for updates every Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for updates
        id: updates
        run: |
          echo "Checking for dependency updates..."
          # This would be replaced with actual update logic
          pnpm outdated || true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: 'chore(deps): update dependencies'
          title: 'chore(deps): update dependencies'
          body: |
            ## Automated Dependency Update

            This PR updates project dependencies to their latest available versions.

            Please review the changes and test thoroughly before merging.

            ### Changes
            - Dependencies have been updated via pnpm
            - Lock file has been regenerated

            ### Testing
            - [ ] Run `pnpm install` locally
            - [ ] Run `pnpm lint` to verify formatting
            - [ ] Run `pnpm typecheck` to verify types
            - [ ] Run `pnpm test` to verify tests pass
            - [ ] Run `pnpm build` to verify builds

            ---
            *This PR was automatically created by GitHub Actions.*
          branch: chore/update-dependencies
          delete-branch: true
          labels: |
            chore
            dependencies
          assignees: |
            ${{ github.repository_owner }}
        continue-on-error: true
